name: Guide correction
description: Suggest a correction to the retirement guides or preserved website.
title: "[Guide]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: PharmaPath is retired and interactive feature development has ended. Suggest a guide or preserved-site correction without sharing personal health or account information.
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What are you trying to understand or accomplish?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Helpful outcome
      description: What information or presentation should be corrected?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
