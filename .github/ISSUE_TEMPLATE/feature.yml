name: Feature request
description: Suggest an improvement to PharmaPath or its guides.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Describe the user need without sharing personal health or account information.
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What are you trying to understand or accomplish?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Helpful outcome
      description: What would you like to be able to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
