# Fresh source-derived validation only. No deployment, restored test suite or provider secrets.
name: Fresh CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fresh-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  validate:
    if: github.repository == 'dylanwlim/pharmapath-docs' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - rebuild-max
      - fresh-ci-${{ github.run_id }}-${{ github.run_attempt }}-validate
    timeout-minutes: 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
    steps:
      - name: "Check fresh trusted runtime and admission request"
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "dylanwlim/pharmapath-docs"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -u)" -ne 0
          test "$(id -un)" = rebuild-ci
          test "${FRESH_CI_REQUEST_LABEL:-}" = "fresh-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-validate"
          python3 - <<'PY'
          import os,pathlib
          required=set(['trusted-default-branch', 'disposable-vm', 'no-private-network-egress', 'clean-job-home', 'credential-free-ci'])
          actual=set(filter(None,os.environ.get('FRESH_CI_RUNTIME_CAPABILITIES','').split(',')))
          assert required <= actual, 'Fresh CI runtime prerequisites are not validated'
          p=pathlib.Path.home()
          assert p.is_dir() and p.stat().st_uid==os.geteuid() and p.stat().st_mode & 0o077 == 0
          temporary=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          settings=dict(NPM_CONFIG_USERCONFIG=temporary/'fresh-ci-user.npmrc',NPM_CONFIG_GLOBALCONFIG=temporary/'fresh-ci-global.npmrc',NPM_CONFIG_CACHE=temporary/'npm-cache')
          for variable in ('NPM_CONFIG_USERCONFIG','NPM_CONFIG_GLOBALCONFIG'):
           config=settings[variable]
           with config.open('x') as stream:os.fchmod(stream.fileno(),0o600)
          with open(os.environ['GITHUB_ENV'],'a') as stream:
           for variable,value in settings.items():
            assert chr(10) not in str(value) and chr(13) not in str(value)
            stream.write(variable+'='+str(value)+chr(10))
          for key in ('GH_TOKEN','GITHUB_TOKEN','NODE_AUTH_TOKEN','NPM_TOKEN','CLOUDFLARE_API_TOKEN','CLOUDFLARE_API_KEY','VERCEL_TOKEN','NEON_API_KEY','SUPABASE_ACCESS_TOKEN','OPENAI_API_KEY','ANTHROPIC_API_KEY','XAI_API_KEY','DATABASE_URL','PAYLOAD_SECRET','DWL_APP_SECRET','DWL_PRODUCT_AUTH_SECRET_ALPINIX'):
           assert not os.environ.get(key), 'Administrative credentials must not be inherited by CI'
          PY
      - name: Check out exact reviewed event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          submodules: false
      - name: "Reject copied environment files"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assert not [p for p in Path('.').glob('.env*') if p.is_file() and not p.name.endswith('.example')], 'CI checkout must not contain runtime env files'
          PY
      - name: "Check current commit whitespace"
        run: |
          git show --format= --check --no-renames HEAD
